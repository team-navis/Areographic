<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>Areographic - 화성 탐사 관제 대시보드</title>
<link rel="icon" type="image/png" href="/assets/brand/mark-64.png"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/grid.js"></script>
<script src="data/sites.js"></script>
<style>
  :root{
    --ink:#dce7fa; --paper:#0b1026; --card:#111a3d; --card2:#0d1430; --line:#28356b; --dim:#8295c2;
    --blue:#2b6fd4; --cyan:#45cfee;
    --orange:#f5a623; --orange-bg:#2b2410; --ok:#35c58f; --ok-bg:#0e2e22;
    --warn:#f5a623; --warn-bg:#2b2410; --danger:#ff5d6c; --danger-bg:#381524;
    --mono:"SF Mono",Menlo,monospace; --shadow:0 4px 20px rgba(2,6,20,.55);
    --navw:212px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;font-size:13px;line-height:1.5}
  #map{position:absolute;inset:0;background:#070b1d}
  .leaflet-container{background:#070b1d;font:inherit}
  button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit}
  button:hover{border-color:#3d4f92}
  button.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
  button.cta{background:var(--orange);color:#131a38;border-color:var(--orange);font-weight:700}
  button.pri:disabled,button.cta:disabled{opacity:.35;cursor:default}
  button.sm{padding:4px 10px;font-size:12px;border-radius:7px}
  :focus-visible{outline:2px solid var(--orange);outline-offset:1px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* 상단 바 */
  #topbar{position:absolute;top:0;left:0;right:0;height:49px;z-index:1200;display:flex;align-items:center;gap:14px;
    padding:8px 16px;background:#ffffff;border-bottom:1px solid #dfe3ec}
  #logoChip{display:flex;align-items:center}
  #logo{height:42px;margin:-5px 0;display:block}
  #screenTitle{font-weight:800;font-size:14px;flex:1;color:#1c2733}
  .pill{border-radius:99px;padding:2px 11px;font-size:12px;font-weight:700}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.danger{background:var(--danger-bg);color:var(--danger)}
  .pill.dim{background:#1a2450;color:var(--dim)}
  .modebadge{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:700;color:var(--dim);white-space:nowrap}
  .modebadge.ctrl{background:var(--cyan);border-color:var(--cyan);color:#071022}

  /* 좌측 내비 (도킹 · 접기) */
  #nav{position:absolute;top:49px;left:0;bottom:0;width:var(--navw);z-index:1150;display:flex;flex-direction:column;
    background:var(--card);border-right:1px solid var(--line);padding:10px 8px;transition:width .18s}
  #nav.min{width:58px}
  #nav .mi{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden}
  #nav .mi:hover{background:#18224c}
  #nav .mi.on{background:rgba(69,207,238,.13);color:var(--cyan);font-weight:700}
  #nav .mi.dis{opacity:.42}
  #nav .mi .ic{width:20px;text-align:center;flex-shrink:0}
  #nav.min .mi .tx{display:none}
  #nav hr{border:none;border-top:1px solid var(--line);margin:8px 2px;width:auto}
  #nav .spacer{flex:1}
  #navToggle{margin:6px 4px 2px;text-align:center}

  /* KPI 스트립 (관제) */
  #kpibar{position:absolute;top:49px;left:var(--navw);right:0;z-index:1140;display:none;align-items:center;gap:16px;
    padding:7px 18px;background:rgba(9,13,32,.94);border-bottom:1px solid var(--line);transition:left .18s}
  #kpibar .ev{font-weight:800}
  .kpi{color:var(--dim);white-space:nowrap}
  .kpi b{color:var(--ink);font-family:var(--mono);font-weight:600}
  #kpiTrack{width:120px;height:5px;border-radius:3px;background:#1a2450;overflow:hidden}
  #kpiFill{height:5px;border-radius:3px;background:var(--cyan);width:0%;display:block}

  /* 플로우 패널 */
  #panel{position:absolute;top:62px;left:calc(var(--navw) + 14px);bottom:14px;width:372px;z-index:1100;display:none;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:left .18s}
  #panelHead{padding:13px 16px 11px;border-bottom:1px solid var(--line)}
  #panelHead h2{margin:0;font-size:16px;font-weight:800}
  #panelHead p{margin:3px 0 0;color:var(--dim)}
  #panelBody{flex:1;overflow-y:auto;padding:14px 16px}
  #panelFoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;background:var(--card)}

  .sec{margin:0 0 15px}
  .sec h3{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.03em}
  .cardbox{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .note{color:var(--dim);font-size:11.5px;line-height:1.55}
  .kv{display:flex;justify-content:space-between;margin:4px 0;gap:10px}
  .kv span:first-child{color:var(--dim)}
  .kv b{font-family:var(--mono);font-weight:600}

  /* 지표 우선순위 */
  .indrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px;cursor:grab}
  .indrow.dragging{opacity:.45;border-style:dashed}
  .indrow.dragover{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  .indrow .grip{color:var(--dim);font-size:13px;cursor:grab;flex-shrink:0}
  .indrow .rk{width:21px;height:21px;border-radius:99px;background:var(--blue);color:#fff;font-weight:800;font-size:11.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .indrow .nm{flex:1}
  .indrow .nm small{display:block;color:var(--dim);font-size:10.5px;line-height:1.35}
  .indrow .wv{font-family:var(--mono);color:var(--orange);font-weight:700;font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{flex:1;font-size:12px;padding:6px 6px;border-radius:8px;white-space:nowrap}
  .chips button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .lockbox{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
  .lockbox .kv b{font-family:inherit}
  .lockbox .ttl{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:5px}

  /* 후보 카드 */
  .cand{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
  .cand:hover{border-color:#3d4f92}
  .cand.sel{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
  .cand.lock{opacity:.6;cursor:default;background:var(--card2)}
  .cand .r1{display:flex;align-items:center;gap:8px}
  .cand .rank{width:22px;height:22px;border-radius:99px;background:var(--blue);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cand .r1 b{flex:1;font-size:13.5px}
  .cand .dist{color:var(--dim);font-family:var(--mono);font-size:12px}
  .cand .sc{font-family:var(--mono);font-weight:800;font-size:16px;color:var(--orange)}
  .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .tag{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--dim);background:var(--paper)}
  .tag.sci{color:var(--cyan);border-color:#1f4a6e;background:#0e2238}
  .tag.warn2{color:var(--warn);border-color:#54430f;background:var(--warn-bg)}

  .chk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px}
  .chk .ic2{flex:0 0 21px;width:21px;height:21px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
  .ic2.ok{background:var(--ok)} .ic2.warn{background:var(--warn)} .ic2.danger{background:var(--danger)}
  .chk span{flex:1}
  .bar{height:7px;border-radius:4px;background:#1a2450;overflow:hidden;margin:4px 0 2px}
  .fill{height:100%;background:var(--cyan);transition:width .4s}

  /* 레이어 패널 */
  #layerbox{position:absolute;right:62px;bottom:14px;z-index:1210;width:282px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;display:none}
  .hintbtn{width:18px;height:18px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--cyan);
    font-size:11px;font-weight:800;padding:0;cursor:pointer;flex-shrink:0;line-height:1;display:inline-flex;align-items:center;justify-content:center;vertical-align:1px}
  .hintbtn:hover{border-color:var(--cyan)}
  #tip{position:absolute;z-index:1650;display:none;max-width:270px;background:#1a2450;border:1px solid var(--cyan);
    border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.55;color:var(--ink);box-shadow:var(--shadow)}
  .presetdesc{margin-top:7px;padding:7px 11px;border-radius:8px;background:rgba(69,207,238,.09);border:1px solid #1f4a6e;color:var(--cyan);font-size:11.5px}
  .leaflet-bar a.on{background:var(--cyan)!important;color:#071022!important}
  #layerBtn{font-size:21px;line-height:28px;font-weight:700;background:var(--orange)!important;color:#131a38!important}
  #layerBtn.on{background:var(--cyan)!important;color:#071022!important}
  #layerbox h3{margin:0 0 7px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .legend{height:8px;border-radius:4px;margin:2px 0 1px;background:linear-gradient(90deg,#4a7fc1,#3fae6a,#d7c427,#e8872a,#dd4a1e)}
  .legend-lab{display:flex;justify-content:space-between;color:var(--dim);font-size:10.5px;margin-bottom:5px}
  .lrow{display:flex;align-items:center;gap:7px;margin:5px 0}
  .lrow input[type=checkbox]{accent-color:var(--orange)}
  .lrow label{flex:1;cursor:pointer;font-size:12.5px}
  #presets{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  #presets button{flex:1;font-size:11.5px;padding:5px 4px;border-radius:7px;white-space:nowrap}
  #presets button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

  /* 전체 화면 페이지 (탐사 현황 · 탐색 분석) */
  #page{position:absolute;top:49px;left:var(--navw);right:0;bottom:0;z-index:1050;display:none;overflow-y:auto;
    background:var(--paper);padding:22px 28px;transition:left .18s}
  #page h2{font-size:18px;font-weight:800}
  .pagegrid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;max-width:1120px;align-items:start}
  @media (max-width:980px){.pagegrid{grid-template-columns:1fr}}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;max-width:1120px}
  .pagecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
  .pagecard h3{margin:0 0 10px;font-size:12.5px;font-weight:800;color:var(--dim);letter-spacing:.03em}
  .arcitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px;background:var(--card2)}

  /* 내비 하단 대원 요약 */
  #crewbox{border-top:1px solid var(--line);margin:8px 2px 0;padding-top:8px;cursor:pointer}
  .cmini{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px}
  .cmini:hover{background:#18224c}
  .cmini .av{width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#071022;flex-shrink:0}
  .cmini .cinfo{flex:1;min-width:0}
  .cmini .cinfo b{display:block;font-size:12px;line-height:1.3}
  .cmini .cinfo small{color:var(--dim);font-size:10.5px;font-family:var(--mono)}
  #nav.min .cmini .cinfo{display:none}

  /* 데이터 출처 (상단 · 배경 없음) */
  #datasrc{position:absolute;top:57px;right:16px;z-index:1040;color:#fff;font-size:10.5px;letter-spacing:.01em;
    text-shadow:0 1px 4px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap}

  /* 지도 범례 */
  #maplegend{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:1040;display:flex;gap:14px;align-items:center;
    background:rgba(13,20,46,.88);border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:10.5px;color:var(--dim);white-space:nowrap}
  #maplegend span{display:flex;align-items:center;gap:5px}
  #maplegend i{display:inline-block;flex-shrink:0}
  .lg-sq{width:10px;height:10px;border-radius:2px;background:linear-gradient(90deg,#4a7fc1,#d7c427,#dd4a1e)}
  .lg-dia{width:8px;height:8px;background:#f5a623;transform:rotate(45deg);border:1px solid #071022}
  .lg-dot{width:10px;height:10px;border-radius:99px;background:#e8872a;border:1.5px solid #fff}
  .lg-ring{width:11px;height:11px;border-radius:99px;border:1.5px dashed #35c58f}
  .lg-crew{width:9px;height:9px;border-radius:99px;background:#f5a623;border:1.5px solid #fff;box-shadow:12px 0 0 -1px #2b6fd4, 12px 0 0 0 #fff}
  @media (max-width:1100px){#maplegend{display:none}}

  /* 관제 카드들 */
  #envcard{position:absolute;top:104px;left:58%;transform:translateX(-50%);z-index:1100;width:250px;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:12px 14px}
  #envcard h3{margin:0 0 6px;font-size:12.5px;font-weight:800}
  #guidecard{position:absolute;top:104px;right:14px;bottom:14px;z-index:1100;width:250px;display:none;flex-direction:column;gap:9px;
    overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 14px}
  #guidecard h3{margin:0;font-size:13px;font-weight:800}
  .act{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .act.next{border-color:var(--cyan);background:rgba(69,207,238,.1)}
  .act b{display:block}
  .act small{color:var(--dim)}
  .act .ck{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
  .act input{accent-color:var(--ok);margin-top:3px}
  #ctrlpanel{position:absolute;top:104px;left:calc(var(--navw) + 14px);z-index:1090;width:286px;max-height:52%;overflow-y:auto;display:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;transition:left .18s}

  /* 이상 감지 연출 */
  #alertglow{position:absolute;inset:0;z-index:1240;pointer-events:none;display:none;
    box-shadow:inset 0 0 130px 34px rgba(255,93,108,.62)}
  body.alerting #alertglow{display:block;animation:glowpulse 1.1s ease-in-out infinite}
  @keyframes glowpulse{0%,100%{opacity:.22}50%{opacity:1}}
  body.alerting #sheet .opt{animation:optblink 1.1s ease-in-out infinite}
  body.alerting #sheet .opt:hover{animation-play-state:paused;border-color:var(--orange)}
  @keyframes optblink{0%,100%{border-color:var(--line);box-shadow:none}50%{border-color:var(--danger);box-shadow:0 0 0 2.5px rgba(255,93,108,.4)}}
  body.alerting #ctrlpanel,body.alerting #envcard,body.alerting #guidecard,
  body.alerting #layerbox,body.alerting #maplegend{opacity:.3;transition:opacity .3s}

  /* 경보·시트·모달 */
  #alertbar{position:absolute;top:88px;left:50%;transform:translateX(-50%);z-index:1300;display:none;
    background:var(--danger-bg);border:1.5px solid var(--danger);color:var(--danger);border-radius:11px;padding:9px 18px;font-weight:700;box-shadow:var(--shadow)}
  #sheet{position:absolute;left:calc(var(--navw) + 14px);right:278px;bottom:14px;z-index:1260;display:none;
    background:var(--card);border:1.5px solid var(--danger);border-radius:14px;box-shadow:var(--shadow);padding:15px 18px;transition:left .18s}
  #sheet h3{margin:0 0 3px;font-size:14px;color:var(--danger)}
  #sheet .opts{display:flex;gap:10px;margin-top:11px}
  #sheet .opt{flex:1;background:var(--card2);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer}
  #sheet .opt:hover{border-color:var(--orange)}
  #sheet .opt b{display:block;margin-bottom:3px}
  #toast{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:1400;display:none;
    background:#1a2450;color:var(--ink);border:1px solid var(--cyan);border-radius:10px;padding:10px 18px;box-shadow:var(--shadow);max-width:70%}
  .modal{position:absolute;inset:0;z-index:1500;display:none;background:rgba(3,6,18,.66);align-items:center;justify-content:center}
  .modal .box{width:460px;max-height:82%;overflow-y:auto;background:var(--card);border-radius:16px;padding:22px 26px;box-shadow:var(--shadow)}
  .modal h2{margin:0 0 10px;font-size:17px}
  .modal h4{margin:14px 0 7px;font-size:12px;color:var(--dim);letter-spacing:.03em}
  .set-kv{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
  .set-kv input[type=number]{width:72px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:inherit;text-align:right;background:var(--card2);color:var(--ink)}
  .set-kv input:disabled{background:#0a0f24;color:var(--dim)}

  .leaflet-tooltip{background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow);border-radius:7px}
  .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border-radius:11px;box-shadow:var(--shadow)}
  .leaflet-popup-tip{background:var(--card)}
  .leaflet-bar a{background:var(--card);color:var(--ink);border-color:var(--line)}
  .leaflet-control-scale-line{background:rgba(17,26,61,.8);color:var(--ink);border-color:var(--line)}
  .leaflet-control-attribution{background:rgba(9,13,32,.8)!important;color:var(--dim)!important}
  .basepin{background:var(--cyan);color:#071022;border-radius:6px;padding:2px 7px;font-weight:800;font-size:10.5px;white-space:nowrap;box-shadow:var(--shadow)}
  .crewpin{border-radius:50%;width:15px;height:15px;border:2.5px solid #fff;box-sizing:border-box;box-shadow:0 1px 5px rgba(0,0,0,.4)}
</style>
<link rel="stylesheet" href="blueprint-theme.css"/>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <span id="logoChip"><img id="logo" src="assets/logo.png" alt="Areographic"></span>
  <span id="screenTitle"></span>
</div>

<div id="nav"></div>

<div id="kpibar">
  <span class="ev">EVA-01</span><span class="pill ok" id="kpiState">탐사 진행 중</span>
  <span class="kpi">경과 <b id="kpiElapsed">00:00:00</b></span>
  <span class="kpi">복귀 소요 <b id="kpiHome">–</b></span>
  <span class="kpi">이동거리 <b id="kpiDist">–</b></span>
  <span id="kpiTrack"><span id="kpiFill"></span></span>
  <span class="kpi">현 위치 생명점수 <b id="kpiIdx">–</b></span>
</div>

<div id="panel">
  <div id="panelHead"><h2 id="phTitle"></h2><p id="phSub"></p></div>
  <div id="panelBody"></div>
  <div id="panelFoot"></div>
</div>

<div id="page"></div>
<div id="datasrc">NASA Trek · 격자 = CRISM / SIM3464 / DEM 실데이터 (marswalk_handoff)</div>
<div id="maplegend">
  <span><i class="lg-sq"></i>생명점수 격자 (파랑 낮음 → 빨강 높음)</span>
  <span><i class="lg-dot"></i>탐사 지점 · 점선 = 안전 제외</span>
  <span><i class="lg-dia"></i>로봇 발견 지점</span>
  <span><i class="lg-ring"></i>복귀 가능 반경</span>
  <span><i class="lg-crew" style="margin-right:12px"></i>대원 A·B</span>
</div>
<div id="layerbox"></div>
<div id="ctrlpanel"></div>
<div id="envcard"></div>

<script>
'use strict';
/* ════════ 설정 (localStorage 영속 - 매번 조정 불필요) ════════ */
const SET_DEFAULT = {
  preset: '과학 권장 (기본)', order: ['S1', 'S2', 'S4', 'S3', 'S5'], formula: 'ROC',
  rangeKm: 3.0,
  crewA: { name: '장원영', mass: 65, load: 18 },
  crewB: { name: '박보검', mass: 80, load: 22 },
  safety: { slopeMax: 25, reserve: 0.15, doseBudget: 1.0, unlocked: false }
};
let SET;
try { SET = Object.assign({}, SET_DEFAULT, JSON.parse(localStorage.getItem('areo_set_v1') || '{}')); }
catch (e) { SET = JSON.parse(JSON.stringify(SET_DEFAULT)); }
SET.safety = Object.assign({}, SET_DEFAULT.safety, SET.safety || {});
['crewA', 'crewB'].forEach(k => {   // 구버전(문자열 이름 + 공용 체중) 마이그레이션
  if (typeof SET[k] === 'string') SET[k] = { name: SET[k], mass: SET.mass || 80, load: SET.load || 20 };
  SET[k] = Object.assign({}, SET_DEFAULT[k], SET[k] || {});
});
if (SET.crewA.name === '박채원') SET.crewA.name = '장원영';   // 구 기본값 이관
if (SET.crewB.name === '김민준') SET.crewB.name = '박보검';
function saveSet() { localStorage.setItem('areo_set_v1', JSON.stringify(SET)); }

/* 가중치 - 순위에서 공식으로 계산 (Barron & Barrett 1996, 손으로 안 고름) */
function calcWeights(order, formula) {
  const N = order.length, W = {};
  order.forEach((k, idx) => {
    const i = idx + 1;
    if (formula === 'RS') W[k] = (N + 1 - i) / (N * (N + 1) / 2);
    else { let s = 0; for (let j = i; j <= N; j++) s += 1 / j; W[k] = s / N; }   // ROC
  });
  return W;
}
let WEIGHTS = calcWeights(SET.order, SET.formula);

/* ════════ 격자 (실데이터 3,067칸) ════════ */
const CELLS = GRID.features.map(f => {
  const ring = f.geometry.coordinates[0];
  const xs = ring.map(p => p[0]), ys = ring.map(p => p[1]);
  return { minx: Math.min(...xs), maxx: Math.max(...xs), miny: Math.min(...ys), maxy: Math.max(...ys), p: f.properties };
});
function cellAt(lat, lon) {
  for (const c of CELLS) if (lon >= c.minx && lon <= c.maxx && lat >= c.miny && lat <= c.maxy) return c.p;
  return null;
}
function cellScore(p) {
  if (!p) return null;
  let raw = 0, wsum = 0;
  for (const k of ['S1', 'S2', 'S3', 'S4', 'S5']) {
    if (p[k] != null) { raw += WEIGHTS[k] * p[k]; wsum += WEIGHTS[k]; }
  }
  return wsum ? Math.round(raw / wsum / 4 * 1000) / 10 : null;
}
function scoreColor(v) { return v == null ? '#999' : v < 30 ? '#4a7fc1' : v < 45 ? '#3fae6a' : v < 62 ? '#d7c427' : v < 80 ? '#e8872a' : '#dd4a1e'; }

/* ════════ 지도 ════════ */
const MarsCRS = L.Util.extend({}, L.CRS.EPSG4326, { R: 3389500 });
const map = L.map('map', { crs: MarsCRS, zoomControl: false, attributionControl: false, minZoom: 3, maxZoom: 17 })
  .setView([BASE.lat + 0.015, BASE.lon - 0.012], 13);
L.control.zoom({ position: 'bottomright' }).addTo(map);
const LayerCtl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const d = L.DomUtil.create('div', 'leaflet-bar');
    const a = L.DomUtil.create('a', '', d);
    a.href = '#'; a.id = 'layerBtn'; a.title = '지도 레이어'; a.innerHTML = '≋';
    L.DomEvent.on(a, 'click', e => { L.DomEvent.stop(e); S.layerOpen = !S.layerOpen; render(); });
    return d;
  }
});
map.addControl(new LayerCtl());
L.control.scale({ position: 'bottomright', imperial: false }).addTo(map);

const TREK = 'https://trek.nasa.gov/tiles/Mars/EQ/';
function trekLayer(id, ext, maxNative, pane, extra) {
  const opts = Object.assign({ maxNativeZoom: maxNative, maxZoom: 17, noWrap: true }, extra || {});
  if (pane) opts.pane = pane;
  return L.tileLayer(TREK + id + '/1.0.0/default/default028mm/{z}/{y}/{x}.' + ext, opts);
}
trekLayer('Mars_Viking_MDIM21_ClrMosaic_global_232m', 'jpg', 7).addTo(map);
map.createPane('p_optical').style.zIndex = 215;
trekLayer('NES_JEZ_MID_Visible_Mosaic_HiRISE_CTX_HRSC_GCS_MARS_07-10-2018', 'png', 17, 'p_optical',
  { bounds: [[17.579, 76.791], [18.693, 77.731]] }).addTo(map);

/* 격자 레이어 4종 (canvas 렌더) */
function gridLayer(pane, styleFn) {
  map.createPane(pane);
  return L.geoJSON(GRID, { renderer: L.canvas({ pane }), pane, style: styleFn, interactive: false });
}
const scoreL = gridLayer('p_score', f => {
  const v = cellScore(f.properties);
  return { stroke: false, fillColor: scoreColor(v), fillOpacity: v == null ? 0 : 0.14 + v / 100 * 0.42 };
});
const slopeL = gridLayer('p_slope', f => {
  const s = f.properties.slope_deg;
  const sig = s > 15;
  return { stroke: sig, color: '#f5a623', weight: 1, opacity: .85,
    fillColor: s > 25 ? '#ff5d6c' : s > 15 ? '#f5a623' : '#8295c2', fillOpacity: s > 25 ? .5 : s > 15 ? .35 : .07 };
});
const commL = gridLayer('p_comm', f => {
  const sh = f.properties.comm === 'shadow';
  return { stroke: sh, color: '#45cfee', weight: 1, opacity: .8, fillColor: '#16335e', fillOpacity: sh ? .42 : 0 };
});
const rockL = gridLayer('p_rock', f => {
  const r = f.properties.rock || 0;
  return { stroke: r >= 0.3, color: '#c98a4b', weight: 1, opacity: .8, fillColor: '#8a5c33', fillOpacity: r * .5 };
});

/* 벡터·핀 레이어 */
map.createPane('p_water'); map.createPane('p_pin');
const waterG = L.layerGroup();
WATER.polys.forEach(p => L.polygon(p.pts, { pane: 'p_water', color: p.color, weight: 1.5, fillColor: p.color, fillOpacity: .25 })
  .bindTooltip(p.name + ' · 근사').addTo(waterG));
WATER.dots.forEach(d => L.circleMarker([d.lat, d.lon], { pane: 'p_water', radius: 5, color: '#fff', weight: 1.5, fillColor: '#3b86d4', fillOpacity: .95 }).bindTooltip(d.name).addTo(waterG));
const pinG = L.layerGroup();
PINS.forEach(p => L.marker([p.lat, p.lon], { pane: 'p_pin',
  icon: L.divIcon({ className: '', html: '<div style="width:11px;height:11px;background:#f5a623;transform:rotate(45deg);border:1.5px solid #071022;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>', iconSize: [11, 11] }) })
  .bindPopup('<b>' + p.name + '</b><br><span style="color:#76808c">' + p.desc + '</span>').addTo(pinG));

const OVL = {
  score:  { name: '생명점수 격자 (실데이터)', on: true,  op: 1,  lyr: scoreL, legend: true },
  water:  { name: '수분·광물 흔적', on: false, op: .85, lyr: waterG },
  pins:   { name: '로봇 발견 핀', on: true,  op: 1,  lyr: pinG },
  slope:  { name: '경사 (안전 게이트)', on: false, op: .9, lyr: slopeL },
  comm:   { name: '교신 음영 (DEM 가시선)', on: false, op: .8, lyr: commL },
  rock:   { name: '암석 피복 (THEMIS 열관성)', on: false, op: .8, lyr: rockL },
  terrain:{ name: '지형 MOLA', on: false, op: .7, lyr: (map.createPane('p_terrain'), trekLayer('Mars_MGS_MOLA_ClrShade_merge_global_463m', 'jpg', 7, 'p_terrain')) },
  thermal:{ name: '온도 THEMIS 야간', on: false, op: .6, lyr: (map.createPane('p_thermal'), trekLayer('THEMIS_NightIR_ControlledMosaics_100m_v2_oct2018', 'png', 9, 'p_thermal')) }
};
const ovlOrder = ['score', 'water', 'pins', 'slope', 'comm', 'rock', 'terrain', 'thermal'];
const paneOf = { score: 'p_score', water: 'p_water', pins: 'p_pin', slope: 'p_slope', comm: 'p_comm', rock: 'p_rock', terrain: 'p_terrain', thermal: 'p_thermal' };
ovlOrder.forEach((k, i) => { map.getPane(paneOf[k]).style.zIndex = 250 + i * 10; });
function applyOvl(k) {
  const o = OVL[k];
  if (o.on) o.lyr.addTo(map); else map.removeLayer(o.lyr);
  map.getPane(paneOf[k]).style.opacity = o.op;
}
Object.keys(OVL).forEach(applyOvl);

const LPRESETS = {
  '생명 탐사': ['score', 'water', 'pins'],
  '안전 점검': ['slope', 'comm', 'rock'],
  '지질·지형': ['terrain', 'water', 'pins'],
  '온도 분석': ['thermal', 'pins']
};
let activePreset = '생명 탐사';
function applyLPreset(name) {
  activePreset = name;
  Object.keys(OVL).forEach(k => { OVL[k].on = LPRESETS[name].includes(k); applyOvl(k); });
  renderLayerbox();
}
function renderLayerbox() {
  const lb = document.getElementById('layerbox');
  lb.innerHTML = '<h3>지도 레이어 (중첩) <button class="hintbtn" id="lbGuide">?</button></h3>' +
    ovlOrder.map(k => {
      const o = OVL[k];
      return (o.legend && o.on ? '<div class="legend"></div><div class="legend-lab"><span>25</span><span>생명점수</span><span>100</span></div>' : '') +
        '<div class="lrow"><input type="checkbox" id="ck_' + k + '" ' + (o.on ? 'checked' : '') + '>' +
        '<label for="ck_' + k + '">' + o.name + '</label></div>';
    }).join('') +
    '<div class="note" style="margin-top:6px">추천 조합</div><div id="presets">' +
    Object.keys(LPRESETS).map(n => '<button class="' + (activePreset === n ? 'on' : '') + '" data-pre="' + n + '">' + n + '</button>').join('') + '</div>';
  ovlOrder.forEach(k => {
    document.getElementById('ck_' + k).onchange = e => { OVL[k].on = e.target.checked; activePreset = null; applyOvl(k); renderLayerbox(); };
  });
  lb.querySelectorAll('[data-pre]').forEach(b => b.onclick = () => applyLPreset(b.dataset.pre));
  document.getElementById('lbGuide').onclick = openGuide;
}

/* ════════ 공통 ════════ */
L.marker([BASE.lat, BASE.lon], { icon: L.divIcon({ className: '', html: '<div class="basepin">🚩 기지</div>', iconSize: [44, 16] }) }).addTo(map);
const wbRing = L.circle([BASE.lat, BASE.lon], { radius: 3000, color: '#35c58f', weight: 1.5, fillColor: '#35c58f', fillOpacity: .04, dashArray: '4 4' })
  .bindTooltip('복귀 가능 반경 (소모품 기준 · 왕복 계산)').addTo(map);
const routeG = L.layerGroup().addTo(map);
const simG = L.layerGroup().addTo(map);
const siteG = L.layerGroup().addTo(map);

function hint(text) {
  return '<button class="hintbtn" data-tip="' + text.replace(/"/g, '&quot;') + '">?</button>';
}
document.addEventListener('click', e => {
  const tip = document.getElementById('tip');
  const b = e.target.closest('.hintbtn');
  if (b && b.dataset.tip) {
    tip.textContent = b.dataset.tip;
    tip.style.display = 'block';
    const r = b.getBoundingClientRect();
    const w = Math.min(270, window.innerWidth - 24);
    let x = Math.min(Math.max(r.left - 20, 10), window.innerWidth - w - 14);
    tip.style.left = x + 'px';
    tip.style.top = Math.min(r.bottom + 7, window.innerHeight - 120) + 'px';
    e.stopPropagation();
  } else if (!e.target.closest('#tip')) tip.style.display = 'none';
}, true);
function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = 'none', ms || 2800);
}
const fmtT = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');
const fmtDur = m => m >= 60 ? Math.floor(m / 60) + '시간 ' + Math.round(m % 60) + '분' : Math.round(m) + '분';

/* ════════ 모델 (1_model_spec - 순수 함수) ════════ */
const SPEED_MS = 0.75, SPEED = SPEED_MS * 60;   // 45 m/분
const WORKMIN = 90;
function pandolf(slopeDeg, uphill) {
  const M = (SET.crewA.mass + SET.crewB.mass) / 2, L = (SET.crewA.load + SET.crewB.load) / 2, v = SPEED_MS;
  const G = uphill ? Math.tan(slopeDeg * Math.PI / 180) * 100 : 0;   // 복귀(내리막)=0 보수
  return 1.5 * M + 2 * (M + L) * Math.pow(L / M, 2) + MODEL.eta * (M + L) * (1.5 * v * v + 0.35 * v * G * MODEL.gMars);
}
function walkRadiusM(minRemainMin) {
  // 복귀 한계: 왕복 ÷2 + 예비분 (§3) - 작업 시간 제외한 보행 예산
  const budget = Math.max(minRemainMin - WORKMIN, 0);
  return budget * SPEED * (1 - SET.safety.reserve) / 2;
}
const FULL_RADIUS_KM = walkRadiusM(Math.min(...MODEL.consumables.map(c => c.cap))) / 1000;

/* ════════ 상태 ════════ */
const S = {
  screen: 'home', site: null, planB: false, emergOk: false,
  ctrlTab: 'mon', layerOpen: false, analyzed: false, actions: { sample: false, analysis: false, crew: false },
  log: [], sim: null, archive: []
};

/* 지점 평가 - 점수는 격자 실데이터, 게이트는 안전 기준 */
function distKm(a, b) { return map.distance(a, b) / 1000; }
function evalSpot(sp) {
  const cell = cellAt(sp.lat, sp.lon);
  const sc = cellScore(cell);
  const d = distKm([BASE.lat, BASE.lon], [sp.lat, sp.lon]);
  const effRange = Math.min(SET.rangeKm, FULL_RADIUS_KM);
  const locks = [];
  if (d > effRange) locks.push('탐색 범위 밖 (' + d.toFixed(1) + ' km > ' + effRange.toFixed(1) + ' km)');
  if (cell && cell.slope_deg > SET.safety.slopeMax) locks.push('경사 ' + cell.slope_deg + '° > 한계 ' + SET.safety.slopeMax + '°');
  return { sp, cell, sc, d, locks, comm: cell ? cell.comm : null };
}
function evalAll() { return SPOTS.map(evalSpot).sort((a, b) => (b.sc || 0) - (a.sc || 0)); }

window.goPin = function (id) {
  const sp = SPOTS.find(x => x.id === id);
  if (!sp || !ROUTES[id]) return;
  S.site = sp; S.planB = false; S.screen = 'route';
  collapseNav(false); map.closePopup(); render();
};
function drawSites() {
  siteG.clearLayers();
  const simActive = S.sim && !S.sim.done;
  evalAll().forEach(ev => {
    const locked = ev.locks.length > 0;
    const fit = !locked && ROUTES[ev.sp.id];
    const popup =
      '<div style="min-width:198px"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">' +
      '<b style="flex:1">' + ev.sp.name + '</b>' +
      '<span style="font-family:var(--mono);font-weight:800;font-size:17px;color:' + (locked ? '#8295c2' : '#f5a623') + '">' + (ev.sc == null ? '-' : ev.sc + '<small style=\"font-size:11px\"> 점</small>') + '</span></div>' +
      '<div class="note" style="margin-bottom:6px">생명점수 (격자 실데이터) · 기지에서 ' + ev.d.toFixed(1) + ' km</div>' +
      (fit
        ? '<span class="pill ok">탐사 적합</span>' + (ev.comm === 'shadow' ? ' <span class="pill warn">교신 음영 - 분기 필요</span>' : '')
        : '<span class="pill danger">탐사 부적합</span><div class="note" style="margin-top:5px">' + (ev.locks.join('<br>') || '경로 미정의') + '</div>') +
      (fit && !simActive ? '<button class="cta sm" style="width:100%;margin-top:9px" onclick="goPin(\'' + ev.sp.id + '\')">탐사 진행 →</button>' : '') +
      '</div>';
    L.circleMarker([ev.sp.lat, ev.sp.lon], {
      radius: 8.5, color: '#fff', weight: 2,
      fillColor: locked ? '#55658f' : scoreColor(ev.sc), fillOpacity: .95, dashArray: locked ? '2 3' : null
    }).bindTooltip(ev.sp.name + ' · ' + (ev.sc == null ? '격자 밖' : '생명점수 ' + ev.sc) + (locked ? ' · 잠금' : ''))
      .bindPopup(popup)
      .addTo(siteG);
  });
}

/* ════════ 좌측 내비 ════════ */
function collapseNav(on) {
  document.body.classList.toggle('navmin', on);
  document.getElementById('nav').classList.toggle('min', on);
  document.documentElement.style.setProperty('--navw', on ? '58px' : '212px');
}
function navItems() {
  const simActive = S.sim && !S.sim.done;
  const items = [['home', '🗺', '지도 홈'], ['status', '🗂', '탐사 현황']];
  if (!simActive) items.push(['auto', '🧬', '탐사지역 탐색·분석']);   // 경로 계획·출발 점검은 탐색·분석을 통해서만 진입
  if (S.sim) items.push(['ctrl', '📡', '실시간 관제']);
  items.push(null, ['settings', '⚙', '상세 설정'], ['guide', '❔', '가이드']);
  return items;
}
function crewVitals() {
  const m = S.sim;
  if (m && !m.done) return [
    { n: SET.crewA.name, hr: Math.round(m.hr), o2: Math.round(Math.min(Math.max(m.rem.o2 / 480 * 100 * 1.03, 0), 100)), c: '#f5a623' },
    { n: SET.crewB.name, hr: Math.round(m.hr * 0.96), o2: Math.round(Math.min(Math.max(m.rem.o2 / 480 * 100 * 0.97, 0), 100)), c: '#2b6fd4' }];
  return [{ n: SET.crewA.name, hr: 68, o2: 100, c: '#f5a623' }, { n: SET.crewB.name, hr: 71, o2: 100, c: '#2b6fd4' }];
}
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = navItems().map(it => {
    if (!it) return '<hr>';
    const [k, ic, tx] = it;
    const cur = S.screen === k || (k === 'auto' && ['route', 'check'].includes(S.screen));
    return '<div class="mi ' + (cur ? 'on' : '') + '" data-k="' + k + '" title="' + tx + '">' +
      '<span class="ic">' + ic + '</span><span class="tx">' + tx + '</span></div>';
  }).join('') +
    '<div class="spacer"></div>' +
    '<div id="crewbox">' + crewVitals().map((c, i) =>
      '<div class="cmini" data-cw="' + (i ? 'crewB' : 'crewA') + '" title="' + c.n + ' 정보 수정"><span class="av" style="background:' + c.c + '">' + (i ? 'B' : 'A') + '</span>' +
      '<span class="cinfo"><b>' + c.n + '</b><small id="cv' + i + '">심박 ' + c.hr + ' · O₂ ' + c.o2 + '%</small></span></div>').join('') + '</div>' +
    '<button class="sm" id="navToggle">' + (document.body.classList.contains('navmin') ? '»' : '« 최소화') + '</button>';
  nav.querySelectorAll('.mi').forEach(el => el.onclick = () => {
    const k = el.dataset.k;
    if (k === 'settings') { openSettings(); return; }
    if (k === 'guide') { openGuide(); return; }
    collapseNav(k === 'auto');   // 탐색·분석에서만 자동 최소화, 그 외 = 펼침(기본)
    S.screen = k; render();
  });
  document.querySelectorAll('#crewbox .cmini').forEach(el => el.onclick = () => openCrewModal(el.dataset.cw));
  document.getElementById('navToggle').onclick = () => { collapseNav(!document.body.classList.contains('navmin')); renderNav(); };
}

/* ════════ 대원 정보 수정 (대원별) ════════ */
function openCrewModal(which) {
  const c = SET[which]; const label = which === 'crewA' ? '대원 A' : '대원 B';
  const cb = document.getElementById('crewBox');
  cb.innerHTML = '<h2>' + label + ' 정보</h2><div class="note">이 대원의 정보만 수정됩니다 - 저장 시 유지 · 대사율은 2인 평균으로 계산</div>' +
    '<div class="set-kv"><span>이름</span><input type="text" id="cw_n" value="' + c.name + '" style="width:120px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font:inherit;background:var(--card2);color:var(--ink)"></div>' +
    '<div class="set-kv"><span>체중 (kg)</span><input type="number" id="cw_m" step="1" min="50" max="120" value="' + c.mass + '"></div>' +
    '<div class="set-kv"><span>적재 하중 (kg)</span><input type="number" id="cw_l" step="1" min="0" max="50" value="' + c.load + '"></div>' +

function renderIndRows() {
  return SET.order.map((k, i) => {
    const ind = INDICATORS.find(x => x.key === k);

      '<span class="nm">' + ind.name + '</span>' + hint(ind.desc) + '</div>';
  }).join('');
}
let dragKey = null;
function bindIndRows(rerender) {
  document.querySelectorAll('.indrow[data-ind]').forEach(el => {
    el.ondragstart = e => { dragKey = el.dataset.ind; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
    el.ondragend = () => { el.classList.remove('dragging'); document.querySelectorAll('.indrow').forEach(x => x.classList.remove('dragover')); };
    el.ondragover = e => { e.preventDefault(); if (el.dataset.ind !== dragKey) el.classList.add('dragover'); };
    el.ondragleave = () => el.classList.remove('dragover');
    el.ondrop = e => {
      e.preventDefault();
      const to = el.dataset.ind;
      if (!dragKey || dragKey === to) return;
      const from = SET.order.indexOf(dragKey), dest = SET.order.indexOf(to);
      SET.order.splice(from, 1); SET.order.splice(dest, 0, dragKey);
      dragKey = null; SET.preset = null; S.analyzed = true; applyWeights(); saveSet(); rerender();
    };
  });
}
function applyWeights() {

}
function basisTags(cell) {

  if (cell.comm === 'shadow') t.push('<span class="tag warn2">교신 음영 - 분기 필요</span>');
  if (cell.rock >= 0.15) t.push('<span class="tag">암석 피복 ' + Math.round(cell.rock * 100) + '%</span>');

}

/* ════════ 화면: 경로 계획 ════════ */
function activeWp() {
  const r = ROUTES[S.site.id];
  return (S.planB && r.altWp) ? r.altWp : r.wp;
}
function routeOneWay() {
  const wp = activeWp(); let d = 0;
  for (let i = 1; i < wp.length; i++) d += map.distance(wp[i - 1], wp[i]);
  return d;
}
function planCalc() {
  const one = routeOneWay();
  const move = one / SPEED, ret = move * 0.95;
  return { one, total: one * 2, move, ret, eta: move + WORKMIN + ret, turn: 9 * 60 + move + WORKMIN };
}
function drawRoute() {
  routeG.clearLayers();
  const r = ROUTES[S.site.id]; if (!r) return;
  const wp = activeWp();
  L.polyline(wp, { color: '#45cfee', weight: 3, opacity: .95 }).addTo(routeG);
  if (!S.planB && r.hiddenSeg != null)
    L.polyline([r.wp[r.hiddenSeg], r.wp[r.hiddenSeg + 1]], { color: '#ff5d6c', weight: 5, dashArray: '6 7' })
      .bindTooltip('교신 음영 구간 (DEM 가시선 실데이터) · 교신 끊김 분기 적용').addTo(routeG);
  if (r.blocked) {
    const b = r.blocked, d = 0.0032;
    L.rectangle([[b.lat - d, b.lon - d], [b.lat + d, b.lon + d]],
      { color: '#f5a623', weight: 1.4, dashArray: '4 4', fillColor: '#f5a623', fillOpacity: .14 }).bindTooltip('⚠ ' + b.note).addTo(routeG);
  }
  wp.slice(1, -1).forEach((w, i) => L.circleMarker(w, { radius: 5, color: '#45cfee', fillColor: '#111a3d', fillOpacity: 1, weight: 2 })
    .bindTooltip('경유 (' + (i + 2) + ')').addTo(routeG));
  L.circleMarker(wp[wp.length - 1], { radius: 9, color: '#fff', fillColor: '#f5a623', fillOpacity: 1, weight: 2.5 })
    .bindTooltip('목적지 (1) · ' + S.site.name, { permanent: true, direction: 'top' }).addTo(routeG);
  map.fitBounds(L.latLngBounds(wp).pad(.35));
}
function renderRoute() {
  setTitle('경로 계획', '');
  show('panel', true, 'flex');
  const P = planCalc(); const r = ROUTES[S.site.id]; const wp = activeWp();
  drawRoute();
  head('경로 계획', '목적지 ' + S.site.name + ' · 세부 정보를 지도에서 확인');
  const cell = cellAt(S.site.lat, S.site.lon);
  body(
    '<div class="sec"><h3>경로 요약 ' + (S.planB ? '<span class="pill warn">플랜 B 적용</span>' : '') + '</h3><div class="cardbox">' +
    '<div class="kv"><span>이동 거리</span><b>' + (P.total / 1000).toFixed(1) + ' km (왕복)</b></div>' +
    '<div class="kv"><span>예상 소요 시간</span><b>' + fmtDur(P.eta) + '</b> <span class="note">(작업 ' + WORKMIN + '분 포함)</span></div>' +
    '<div class="kv"><span>경유 지점</span><b>' + (wp.length - 2) + '개</b></div>' +
    '<div class="kv"><span>복귀 개시 시각</span><b>' + fmtT(P.turn) + '</b> <span class="note">(출발 09:00 기준)</span></div></div></div>' +
    '<div class="sec"><h3>경로 세부 (격자 실데이터)</h3><div class="cardbox">' +
    '<div class="kv"><span>목적지 경사</span><b>' + (cell ? cell.slope_deg + '°' : '-') + '</b></div>' +
    '<div class="kv"><span>교신</span><span>' + (S.planB ? '양호 (음영 회피)' : (r.hiddenSeg != null ? '음영 구간 1곳 - 분기 합의됨' : (cell && cell.comm === 'shadow' ? '목적지 음영' : '양호'))) + '</span></div>' +
    '<div class="kv"><span>암석 피복</span><b>' + (cell ? Math.round((cell.rock || 0) * 100) + '%' : '-') + '</b> <span class="note">(경로 비용 가중)</span></div>' +
    '<div class="kv"><span>에너지 소모</span><b>약 ' + Math.round(pandolf(cell ? cell.slope_deg : 5, true) * 0.86 * P.eta / 60) + ' kcal</b> <span class="note">(Pandolf)</span></div></div></div>' +
    (r.altWp ? '<div class="sec"><button id="planBBtn" style="width:100%">✎ 경로 수정 - ' + (S.planB ? '플랜 A로 복귀' : r.altNote) + '</button></div>' : '')
  );
  foot('<button id="backRes">← 탐색·분석</button><button class="cta" id="goCheck">출발 점검 →</button>');
  const pb = document.getElementById('planBBtn');
  if (pb) pb.onclick = () => { S.planB = !S.planB; renderRoute(); };
  document.getElementById('backRes').onclick = () => { S.screen = 'auto'; render(); };
  document.getElementById('goCheck').onclick = () => { S.screen = 'check'; render(); };
}

/* ════════ 관제 - 시뮬레이션 (모델 스펙 §1~§6) ════════ */
function segLerp(wp, cum, total, f) {
  const d = f * total;
  for (let i = 1; i < wp.length; i++) if (d <= cum[i]) {
    const t = (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
    return [wp[i - 1][0] + (wp[i][0] - wp[i - 1][0]) * t, wp[i - 1][1] + (wp[i][1] - wp[i - 1][1]) * t];
  }
  return wp[wp.length - 1];
}
function addLog(msg, lvl) { S.log.unshift({ t: S.sim ? S.sim.t : 0, msg, lvl: lvl || 'ok' }); }
function startSim() {
  const P = planCalc(); const wp = activeWp(); const r = ROUTES[S.site.id];
  const cum = [0]; for (let i = 1; i < wp.length; i++) cum.push(cum[i - 1] + map.distance(wp[i - 1], wp[i]));
  const rem = {}; MODEL.consumables.forEach(c => rem[c.key] = c.cap);
  S.sim = {
    wp, r, cum, total: cum[cum.length - 1], P, t: 0, phase: 'out', f: 0,
    rem, stam: 100, dose: 0, hr: 70, workT: 0,
    speFired: false, commFired: false, eventActive: false, shielded: false, done: false, actual: [], pos: wp[0]
  };
  addLog('EVA-01 출발 - 목적지 ' + S.site.name + ' · 대원 2인');
  routeG.clearLayers(); simG.clearLayers();
  L.polyline(wp, { color: '#5f7bd6', weight: 2, dashArray: '5 6', opacity: .9 }).bindTooltip('계획 경로').addTo(simG);
  if (!S.planB && r.hiddenSeg != null) L.polyline([r.wp[r.hiddenSeg], r.wp[r.hiddenSeg + 1]], { color: '#ff5d6c', weight: 3.5, dashArray: '6 7', opacity: .6 }).addTo(simG);
  S.sim.actualLine = L.polyline([], { color: '#45cfee', weight: 3 }).addTo(simG);
  S.sim.mA = L.marker(wp[0], { icon: L.divIcon({ className: '', html: '<div class="crewpin" style="background:#f5a623"></div>', iconSize: [15, 15] }) }).bindTooltip('대원 A', { direction: 'right' }).addTo(simG);
  S.sim.mB = L.marker(wp[0], { icon: L.divIcon({ className: '', html: '<div class="crewpin" style="background:#2b6fd4"></div>', iconSize: [15, 15] }) }).bindTooltip('대원 B', { direction: 'left' }).addTo(simG);
  map.fitBounds(L.latLngBounds(wp.concat([[BASE.lat, BASE.lon]])).pad(.3));
  applyLPreset('생명 탐사');
  S.sim.timer = setInterval(simTick, 550);
}
function simTick() {
  const m = S.sim; if (!m || m.done) return;
  if (m.eventActive) { renderKpi(); return; }
  m.t += 1;   // 1틱 = 1분(모의)
  const cell = cellAt(m.pos[0], m.pos[1]);
  const moving = m.phase !== 'work';
  const MW = moving ? pandolf(cell ? cell.slope_deg : 5, m.phase === 'out') : MODEL.baseMW * 1.15;
  const fRate = MW / MODEL.baseMW;
  MODEL.consumables.forEach(c => { m.rem[c.key] -= (c.scale ? fRate * c.scale : 1); });
  const pctVO2 = Math.min((MW * MODEL.o2PerWatt) / MODEL.vo2abs, 1);
  m.hr = Math.min(Math.round(MODEL.hrA + MODEL.hrB * pctVO2), MODEL.hrMax);
  m.stam = Math.min(Math.max(m.stam + (pctVO2 > MODEL.sustain ? -14 * (pctVO2 - MODEL.sustain) : 8 * (MODEL.sustain - pctVO2)), 0), 100);
  const shF = m.shielded ? (1 - DONKI.spe.shieldPct / 100) : 1;
  m.dose += (MODEL.radDay / 1440) * shF;
  const spe = DONKI.spe;
  if (m.t >= spe.onset && m.t < spe.onset + spe.dur) m.dose += (spe.spike / spe.dur) * shF;
  if (!m.speFired && m.t >= spe.onset) { m.speFired = true; fireEvent('sep'); return; }

  if (m.phase === 'out') {
    m.f = Math.min(m.t / m.P.move, 1);
    if (m.f >= 1) { m.phase = 'work'; m.workT = 0; addLog('목적지 도착 - 현장 작업 시작'); }
  } else if (m.phase === 'work') {
    m.f = 1; m.workT += 1;
    if (m.workT >= 22) { m.phase = 'ret'; m.retStart = m.t; addLog('작업 완료 - 복귀 개시'); }
  } else {
    const rf = Math.min((m.t - m.retStart) / m.P.ret, 1);
    m.f = (m.retFrom != null ? m.retFrom : 1) * (1 - rf);
    if (!m.commFired && !S.planB && m.r.hiddenSeg != null) {
      const h0 = m.cum[m.r.hiddenSeg] / m.total, h1 = m.cum[m.r.hiddenSeg + 1] / m.total;
      if (m.f <= h1 && m.f >= h0) { m.commFired = true; fireEvent('comm'); return; }
    }
    if (rf >= 1) { endSim(); return; }
  }
  const pA = segLerp(m.wp, m.cum, m.total, m.f);
  const pB = segLerp(m.wp, m.cum, m.total, Math.max(m.f - 0.03, 0));
  m.pos = pA;
  m.mA.setLatLng(pA); m.mB.setLatLng(pB);
  m.actual.push(pA); m.actualLine.setLatLngs(m.actual);
  wbRing.setRadius(Math.max(walkRadiusM(Math.min(...Object.values(m.rem))), 150));
  renderKpi(); renderEnv(); renderGuideCard();
  const cvs = crewVitals();
  ['cv0', 'cv1'].forEach((id, i) => { const el = document.getElementById(id); if (el) el.textContent = '심박 ' + cvs[i].hr + ' · O₂ ' + cvs[i].o2 + '%'; });
  if (['mon', 'crew'].includes(S.ctrlTab)) renderCtrlPanel();
}
function fireEvent(kind) {

function resolveEvent(kind, pick) {

  }
  cp.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px">' +
    TABS.map(([k, t]) => '<button class="sm" style="' + (S.ctrlTab === k ? 'background:var(--ink);color:#fff;border-color:var(--ink)' : '') + '" data-tab="' + k + '">' + t + '</button>').join('') + '</div>' + html;
  cp.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.ctrlTab = b.dataset.tab; renderCtrlPanel(); });
}
function crewRow(n, m, k) {
  const o2 = Math.min(Math.max(m.rem.o2 / 480 * 100 * k, 0), 100);
  const c = o2 < 30 ? 'danger' : o2 < 55 ? 'warn' : 'ok';
  return '<div class="cardbox" style="margin-bottom:7px"><div class="kv"><b>' + n + '</b><span class="pill ' + c + '">산소 ' + Math.round(o2) + '%</span></div>' +
    '<div class="kv"><span>심박</span><b>' + Math.round(m.hr * (k === 1.03 ? 1 : 0.96)) + ' bpm</b></div>' +
    '<div class="kv"><span>체력</span><b>' + Math.round(m.stam) + '%</b></div>' +
    '<div class="kv"><span>최종 수신</span><span>' + (m.eventActive && m.kind === 'comm' ? '3분 전 ⚠' : (2 + m.t % 11) + '초 전') + '</span></div></div>';
}

/* ════════ 상세 설정 (수동 조정 - 영속 저장) ════════ */
function openSettings() {
  const sb = document.getElementById('setBox');
  const un = SET.safety.unlocked;
  sb.innerHTML = '<h2>상세 설정</h2><div class="note">저장하면 다음 실행에도 유지됩니다 - 매번 조정할 필요 없음</div>' +
    '<h4>탐색·대원</h4>' +
    '<div class="set-kv"><span>탐색 범위 (km) <span class="note">최대 ' + FULL_RADIUS_KM.toFixed(1) + ' = 복귀 가능 반경</span></span><input type="number" id="st_range" step="0.5" min="0.5" max="' + FULL_RADIUS_KM.toFixed(1) + '" value="' + SET.rangeKm + '"></div>' +
    '<div class="note" style="margin:4px 0 2px">대원 이름·체중·하중은 좌측 메뉴 하단 대원 카드에서 개별 수정</div>' +
    '<h4>지표 우선순위 - 드래그로 순서 변경 (가중치 = ' + SET.formula + ' 공식 자동 계산)</h4>' + renderIndRows() +
    '<div class="set-kv"><span>가중치 공식</span><span><button class="sm ' + (SET.formula === 'ROC' ? 'pri' : '') + '" id="st_roc">ROC (상위 강조)</button> <button class="sm ' + (SET.formula === 'RS' ? 'pri' : '') + '" id="st_rs">RS (완만)</button></span></div>' +
    '<h4>안전 기준 🔒</h4>' +
    '<div class="set-kv"><span>경사 한계 (°)</span><input type="number" id="st_slope" ' + (un ? '' : 'disabled') + ' step="1" min="10" max="30" value="' + SET.safety.slopeMax + '"></div>' +
    '<div class="set-kv"><span>소모품 예비분 (%)</span><input type="number" id="st_res" ' + (un ? '' : 'disabled') + ' step="5" min="10" max="30" value="' + Math.round(SET.safety.reserve * 100) + '"></div>' +
    '<div class="set-kv"><span>피폭 예산 (mSv/EVA)</span><input type="number" id="st_dose" ' + (un ? '' : 'disabled') + ' step="0.1" min="0.5" max="2" value="' + SET.safety.doseBudget + '"></div>' +
    '<label class="set-kv" style="cursor:pointer"><span class="note">안전 기준 수동 조정 활성화 - 권장하지 않음 · 조정 내역이 기록됩니다</span><input type="checkbox" id="st_unlock" ' + (un ? 'checked' : '') + '></label>' +
    '<div style="display:flex;gap:8px;margin-top:14px"><button id="st_reset">기본값 복원</button><button class="pri" id="st_save" style="flex:1">저장</button></div>';
  document.getElementById('setModal').style.display = 'flex';
  bindIndRows(openSettings);
  document.getElementById('st_roc').onclick = () => { SET.formula = 'ROC'; SET.preset = null; applyWeights(); saveSet(); openSettings(); };
  document.getElementById('st_rs').onclick = () => { SET.formula = 'RS'; SET.preset = null; applyWeights(); saveSet(); openSettings(); };
  document.getElementById('st_unlock').onchange = e => {
    SET.safety.unlocked = e.target.checked;
    if (e.target.checked) { addLog('안전 기준 수동 조정 활성화 - 사유 기록 필요', 'warn'); toast('안전 기준 잠금 해제 - 권장하지 않음'); }
    saveSet(); openSettings();
  };
  document.getElementById('st_reset').onclick = () => {
    SET = JSON.parse(JSON.stringify(SET_DEFAULT)); applyWeights(); saveSet(); openSettings();
    toast('기본값(안전 권장) 복원됨');
  };
  document.getElementById('st_save').onclick = () => {
    SET.rangeKm = Math.min(+document.getElementById('st_range').value || 3, FULL_RADIUS_KM);
    if (SET.safety.unlocked) {
      SET.safety.slopeMax = +document.getElementById('st_slope').value || 25;
      SET.safety.reserve = (+document.getElementById('st_res').value || 15) / 100;
      SET.safety.doseBudget = +document.getElementById('st_dose').value || 1.0;
    }
    saveSet(); applyWeights();
    wbRing.setRadius(Math.min(SET.rangeKm, FULL_RADIUS_KM) * 1000);
    document.getElementById('setModal').style.display = 'none';
    toast('설정 저장됨 - 다음 실행에도 유지');
    render();
  };
}

/* ════════ 가이드 ════════ */
function openGuide() {
  const gb = document.getElementById('guideBox');
  gb.innerHTML = '<h2>지표 · 레이어 가이드</h2>' +
    [['생명점수', '격자 셀(160m)마다 지표 S1~S5(0~4 증거강도)를 순위 기반 가중치(ROC)로 가중합 → 0~100. 실데이터: CRISM 광물 + USGS 지질. 생명 확률이 아닌 탐사 우선도'],
     ['가중치', '숫자를 손으로 고르지 않음 - 지표 순위만 정하면 Barron ROC/RS 공식이 계산 (기본 45.7/25.7/15.7/9/4%)'],
     ['안전 게이트', '복귀 가능 반경(왕복÷2+예비분)·경사 한계·피폭 예산 - 점수에 합산하지 않고 추천을 잠금. 기본 잠금, 해제는 상세 설정에서 명시적 확인'],
     ['복귀 한계', '소모품 4종(산소·냉각수·CO₂·배터리) 중 가장 먼저 바닥나는 것이 결정 (아폴로 PLSS 실측)'],
     ['교신 음영', 'DEM 가시선 계산 - 기지에서 지형에 가리는 셀. 측정 전파 아님(참고용)'],
     ['암석 피복', 'THEMIS 열관성 → 바위밭 비율. 경로 비용에 가중(우회), 통행 차단은 경사가 담당'],
     ['피폭', '기준 0.64 mSv/sol (Curiosity RAD) + 방사능 폭풍 시 급증 · 지형 차폐 최대 20%'],
     ['상태 색상', '정상 초록 · 주의 주황 · 위험 빨강 (전 화면 공통)']]
    .map(([t, d]) => '<div class="kv" style="align-items:flex-start;gap:12px"><b style="min-width:92px">' + t + '</b><span class="note">' + d + '</span></div>').join('') +
    '<button class="pri" style="width:100%;margin-top:12px" onclick="document.getElementById(\'guideModal\').style.display=\'none\'">닫기</button>';
  document.getElementById('guideModal').style.display = 'flex';
}

/* ════════ 렌더 루트 ════════ */
function setTitle(t) { document.getElementById('screenTitle').textContent = t; }
function head(t, s) { document.getElementById('phTitle').textContent = t; document.getElementById('phSub').textContent = s; }
function body(h) { document.getElementById('panelBody').innerHTML = h; }
function foot(h) { document.getElementById('panelFoot').innerHTML = h; }
function show(id, on, flex) { document.getElementById(id).style.display = on ? (flex || 'block') : 'none'; }
function render() {
  renderNav();
  show('kpibar', S.screen === 'ctrl', 'flex');
  document.getElementById('datasrc').style.top = S.screen === 'ctrl' ? '88px' : '57px';
  show('layerbox', !!S.layerOpen);
  const lbtn = document.getElementById('layerBtn');
  if (lbtn) lbtn.classList.toggle('on', !!S.layerOpen);
  document.getElementById('tip').style.display = 'none';
  show('ctrlpanel', S.screen === 'ctrl');
  show('envcard', S.screen === 'ctrl' && !!S.sim);
  show('guidecard', S.screen === 'ctrl' && !!S.sim, 'flex');
  if (S.screen !== 'ctrl') { show('alertbar', false); show('sheet', false); }
  show('page', S.screen === 'status' || S.screen === 'auto');
  show('panel', false);
  if (S.screen === 'home') { renderHome(); routeG.clearLayers(); }
  else if (S.screen === 'status') renderStatus();
  else if (S.screen === 'auto') renderAuto();
  else if (S.screen === 'route') renderRoute();
  else if (S.screen === 'check') renderCheck();
  else if (S.screen === 'ctrl') { setTitle('실시간 관제'); show('panel', false); renderCtrlPanel(); renderKpi(); renderEnv(); renderGuideCard(); }
  drawSites();
  renderLayerbox();
}
wbRing.setRadius(Math.min(SET.rangeKm, FULL_RADIUS_KM) * 1000);
applyWeights();
render();
</script>
