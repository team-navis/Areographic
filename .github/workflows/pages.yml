name: Deploy submission to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Check publication scope
        run: |
          test -f dist/index.html
          test -f dist/pad/pad.html
          test -f dist/models/nasa/mark-iii-spacesuit.glb
          test ! -e dist/models/eva
          test ! -e dist/models/operator
          test ! -e dist/models/rover
      - name: Record the deployed source revision
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('dist/deployment.json', JSON.stringify({source_sha: process.env.GITHUB_SHA, workflow_run: process.env.GITHUB_RUN_ID, built_at: new Date().toISOString()}, null, 2));"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
